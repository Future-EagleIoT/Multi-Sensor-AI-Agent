## EMQX 5.8 Configuration — Future Eagle IIoT SaaS (Localhost mTLS + Multi-Tenant ACL)

node {
  name = "emqx@127.0.0.1"
  cookie = "future_eagle_local_cookie"
  data_dir = "data"
}

log {
  console {
    level = warning
  }
}

dashboard {
  listeners.http {
    bind = 18083
  }
  default_username = "admin"
  default_password = "eagle_emqx_admin"
}

## Disable plaintext MQTT (1883) and unconfigured WS/WSS — enforce mTLS only on 8883!
listeners.tcp.default {
  enable = false
}

listeners.ws.default {
  enable = false
}

listeners.wss.default {
  enable = false
}

listeners.ssl.default {
  bind = "0.0.0.0:8883"
  max_connections = 1024
  acceptors = 4
  ssl_options {
    cacertfile = "/opt/emqx/etc/certs/ca.crt"
    certfile = "/opt/emqx/etc/certs/broker.crt"
    keyfile = "/opt/emqx/etc/certs/broker.key"
    verify = verify_peer
    fail_if_no_peer_cert = true
    versions = ["tlsv1.3", "tlsv1.2"]
  }
}

## Extract authenticated client identity directly from verified X.509 certificate CN
mqtt {
  peer_cert_as_username = cn
  max_packet_size = "256KB"
  keepalive_multiplier = 1.5
}

## Multi-tenant topic Authorization: PostgreSQL dynamic ACLs + deny-by-default
authorization {
  no_match = deny
  deny_action = disconnect
  cache {
    enable = true
    max_size = 4096
    ttl = "10s"
  }
  sources = [
    {
      type = postgresql
      enable = true
      server = "timescaledb:5432"
      database = "future_eagle_saas"
      username = "eagle_admin"
      password = "eagle_dev_password_change_me"
      pool_size = 4
      ssl {
        enable = false
      }
      query = "SELECT action, permission, topic FROM mqtt_acl WHERE username = ${username}"
    },
    {
      type = file
      enable = true
      path = "/opt/emqx/etc/acl.conf"
    }
  ]
}
