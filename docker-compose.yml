name: future-eagle-saas

# Full Localhost Multi-Tenant Industrial IoT SaaS Stack
# Zero AWS • Zero Cloudflare • Tuned for ~1.0 GiB total RAM on 7 GiB workstation

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: eagle-timescaledb
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eagle_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eagle_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-future_eagle_saas}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=100
      - -c
      - timescaledb.telemetry_level=off
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eagle_admin} -d ${POSTGRES_DB:-future_eagle_saas}"]
      interval: 5s
      timeout: 5s
      retries: 15

  valkey:
    image: valkey/valkey:8-alpine
    container_name: eagle-valkey
    restart: unless-stopped
    mem_limit: 128m
    command: ["valkey-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    container_name: eagle-nats
    restart: unless-stopped
    mem_limit: 128m
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  emqx:
    image: emqx/emqx:5.8
    container_name: eagle-emqx
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      timescaledb:
        condition: service_healthy
    ports:
      - "8883:8883"
      - "127.0.0.1:18083:18083"
    volumes:
      - ./infra/emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./infra/emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - ./infra/certs:/opt/emqx/etc/certs:ro
      - emqx_data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 15

  storage:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: eagle-storage
    restart: unless-stopped
    mem_limit: 192m
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-eagle_storage}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-eagle_storage_secret_123}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  storage-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    container_name: eagle-storage-init
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 ${S3_ACCESS_KEY:-eagle_storage} ${S3_SECRET_KEY:-eagle_storage_secret_123} &&
      mc mb --ignore-existing local/${S3_BUCKET:-future-eagle-artifacts} &&
      echo '[Storage] Bucket ready.'
      "
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    container_name: eagle-mailpit
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # --- Application Services (Backend API + Decoupled Workers) ---
  api:
    build:
      context: ./backend
    image: future-eagle-backend:local
    container_name: eagle-api
    restart: unless-stopped
    mem_limit: 256m
    env_file:
      - .env.saas
    depends_on:
      timescaledb:
        condition: service_healthy
      valkey:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - ./infra/certs:/certs
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  ingestor:
    image: future-eagle-backend:local
    container_name: eagle-ingestor
    restart: unless-stopped
    mem_limit: 192m
    env_file:
      - .env.saas
    command: ["python", "-m", "app.workers.ingestor"]
    depends_on:
      api:
        condition: service_healthy
      emqx:
        condition: service_healthy
      nats:
        condition: service_healthy
    volumes:
      - ./infra/certs:/certs:ro

  rules-engine:
    image: future-eagle-backend:local
    container_name: eagle-rules-engine
    restart: unless-stopped
    mem_limit: 192m
    env_file:
      - .env.saas
    command: ["python", "-m", "app.workers.rules_engine"]
    depends_on:
      api:
        condition: service_healthy
      valkey:
        condition: service_healthy
      nats:
        condition: service_healthy

  ai-worker:
    image: future-eagle-backend:local
    container_name: eagle-ai-worker
    restart: unless-stopped
    mem_limit: 192m
    env_file:
      - .env.saas
    command: ["python", "-m", "app.workers.ai_worker"]
    depends_on:
      api:
        condition: service_healthy
      nats:
        condition: service_healthy

  web:
    build:
      context: ./web
    image: future-eagle-web:local
    container_name: eagle-web
    restart: unless-stopped
    mem_limit: 64m

  gateway:
    image: nginx:alpine
    container_name: eagle-gateway
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  # Virtual Multi-Factory Fleet Simulator (2 companies x 3 machines over mTLS)
  simulator:
    image: future-eagle-backend:local
    container_name: eagle-simulator
    profiles: ["sim"]
    restart: unless-stopped
    mem_limit: 128m
    env_file:
      - .env.saas
    environment:
      EMQX_HOST: emqx
      EMQX_PORT: "8883"
      VALKEY_URL: redis://valkey:6379/0
      CERTS_DIR: /certs
    command: ["python", "/sim/fleet_sim.py", "--interval", "3"]
    depends_on:
      ingestor:
        condition: service_started
    volumes:
      - ./simulator:/sim:ro
      - ./infra/certs:/certs:ro

  # Optional local LLM profile: `docker compose --profile local-ai up -d`
  ollama:
    image: ollama/ollama:latest
    container_name: eagle-ollama
    profiles: ["local-ai"]
    restart: unless-stopped
    mem_limit: 2048m
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  pg_data:
  valkey_data:
  nats_data:
  emqx_data:
  storage_data:
  ollama_data:
