name: future-eagle-saas

# Full Localhost Multi-Tenant Industrial IoT SaaS Stack
# Zero AWS • Zero Cloudflare • Tuned for ~1 GiB total RAM on 7 GiB workstation

services:
  timescaledb:
    image: timescale/timescaledb-ha:pg16
    container_name: eagle-timescaledb
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eagle_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eagle_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-future_eagle_saas}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=100
      - -c
      - timescaledb.telemetry_level=off
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/home/postgres/pgdata/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eagle_admin} -d ${POSTGRES_DB:-future_eagle_saas}"]
      interval: 5s
      timeout: 5s
      retries: 15

  valkey:
    image: valkey/valkey:8-alpine
    container_name: eagle-valkey
    restart: unless-stopped
    mem_limit: 128m
    command: ["valkey-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    container_name: eagle-nats
    restart: unless-stopped
    mem_limit: 128m
    command: ["-js", "-sd", "/data", "-m", "8222", "--max_payload", "1MB"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  emqx:
    image: emqx/emqx:5.8
    container_name: eagle-emqx
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      timescaledb:
        condition: service_healthy
    ports:
      - "8883:8883"
      - "127.0.0.1:18083:18083"
    volumes:
      - ./infra/emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./infra/emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - ./infra/certs:/opt/emqx/etc/certs:ro
      - emqx_data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 15

  storage:
    image: rustfs/rustfs:latest
    container_name: eagle-storage
    restart: unless-stopped
    mem_limit: 192m
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-eagle_storage}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-eagle_storage_secret_123}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    command: ["/data"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - storage_data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: eagle-mailpit
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # Optional local LLM profile: `docker compose --profile local-ai up -d`
  ollama:
    image: ollama/ollama:latest
    container_name: eagle-ollama
    profiles: ["local-ai"]
    restart: unless-stopped
    mem_limit: 2048m
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  pg_data:
  valkey_data:
  nats_data:
  emqx_data:
  storage_data:
  ollama_data:
